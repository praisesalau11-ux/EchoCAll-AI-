<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - EchoCall AI</title>

    <link
        rel="stylesheet"
        href="css/reset-password.css"
    >

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0"
    >

</head>

<body>

    <div class="background"></div>

    <main class="auth-page">

        <div class="glass-card">

            <img
                src="assets/logo.png"
                class="logo"
                alt="EchoCall AI"
            >

            <h1>Reset your password</h1>

            <p class="subtitle">
                Create a new password for your EchoCall AI account.
            </p>

            <form id="resetPasswordForm">

                <div class="input-group">

                    <label for="newPassword">
                        New password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter new password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            id="toggleNewPassword"
                            class="password-toggle"
                        >
                            <span class="material-symbols-rounded">
                                visibility
                            </span>
                        </button>

                    </div>

                </div>


                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm new password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm new password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            id="toggleConfirmPassword"
                            class="password-toggle"
                        >
                            <span class="material-symbols-rounded">
                                visibility
                            </span>
                        </button>

                    </div>

                </div>


                <p class="password-hint">
                    Use at least 6 characters.
                </p>


                <button
                    type="submit"
                    class="primary-btn"
                    id="resetPasswordButton"
                >
                    Reset Password
                </button>

            </form>


            <button
                type="button"
                id="backToLogin"
                class="back-btn"
            >

                <span class="material-symbols-rounded">
                    arrow_back
                </span>

                Back to Login

            </button>

        </div>

    </main>


    <script
        type="module"
        src="js/reset-password.js"
    ></script>

</body>

</html>
